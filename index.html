<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>歡樂轉盤抽籤！</title>

  <!-- Google Fonts 胖胖字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Zen Maru Gothic', 'Mochiy Pop One', cursive, sans-serif;
      font-weight: 900;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 15px 10px 50px 10px;
      background-color: #FAF8F5;
      color: #222222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 活動標題 */
    h1 {
      font-size: 1.8rem;
      color: #222222;
      text-align: center;
      margin: 10px 0 15px 0;
      -webkit-text-stroke: 1.5px #FFFFFF;
      text-shadow: 2px 2px 0px #FFB3BA, 4px 4px 0px rgba(0,0,0,0.15);
      letter-spacing: 1px;
      word-break: break-all;
    }

    .card {
      background: white;
      padding: 18px 15px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 380px;
      margin-bottom: 20px;
      text-align: center;
      border: 3px solid #222;
    }

    .section-title {
      font-size: 1.3rem;
      color: #222222;
      margin-bottom: 12px;
      background: #FFF3F4;
      padding: 6px 16px;
      border-radius: 30px;
      display: inline-block;
      border: 2px solid #FFB3BA;
    }

    .btn {
      background-color: #FFB3BA;
      color: #222222;
      border: 2px solid #222222;
      padding: 12px 24px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0px #222222;
      transition: all 0.1s ease;
      margin: 8px 4px;
      display: inline-block;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0px #222222;
    }

    .btn:disabled {
      background-color: #E0E0E0;
      color: #888888;
      border-color: #AAAAAA;
      box-shadow: 0 4px 0px #AAAAAA;
      cursor: not-allowed;
      transform: none;
    }

    input[type="text"] {
      width: 80%;
      padding: 10px;
      border: 3px solid #222222;
      border-radius: 16px;
      font-size: 1rem;
      text-align: center;
      outline: none;
      background-color: #FFF;
      color: #222222;
      margin-bottom: 8px;
    }

    /* 連線名單標籤 */
    .user-tag {
      display: inline-block;
      background: #BAFFC9;
      border: 2px solid #222;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin: 3px;
      box-shadow: 2px 2px 0px #222;
    }

    /* 轉盤容器 */
    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 10px auto;
    }

    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #FF4757;
      z-index: 10;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,0.3));
    }

    canvas {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      border: 4px solid #222222;
    }

    .result-box {
      font-size: 1.3rem;
      color: #FF4757;
      min-height: 40px;
      margin-top: 10px;
      background: #FAFAFA;
      padding: 8px;
      border-radius: 12px;
      border: 2px dashed #FFB3BA;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .disabled-card {
      opacity: 0.4;
      pointer-events: none;
    }

    /* 全螢幕倒數 & 恭喜 Modal */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .countdown-text {
      font-size: 6rem;
      color: #FFFFBA;
      -webkit-text-stroke: 3px #222;
      text-shadow: 4px 4px 0px #FF4757;
      animation: pop 0.8s infinite;
    }

    .winner-modal {
      background: #FFF;
      border: 4px solid #222;
      border-radius: 30px;
      padding: 30px 20px;
      width: 85%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 0px #FFB3BA;
      transform: scale(0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .overlay.active .winner-modal {
      transform: scale(1);
    }

    .winner-title {
      font-size: 1.8rem;
      color: #FF4757;
      margin-bottom: 10px;
    }

    .winner-name {
      font-size: 2.2rem;
      color: #222;
      background: #FFFFBA;
      border: 3px solid #222;
      border-radius: 20px;
      padding: 10px;
      margin: 15px 0;
      box-shadow: 3px 3px 0px #222;
    }

    @keyframes pop {
      0% { transform: scale(0.6); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- 活動大標題 -->
  <h1 id="event-title-display">⛺️ 露營大會：選總召與會計！</h1>

  <!-- 房間與連線區塊 -->
  <div class="card">
    <div id="status" style="font-size:0.95rem; color:#555; margin-bottom:8px;">未連線</div>
    
    <div id="room-controls">
      <!-- 建立房間選項 -->
      <div style="border-bottom: 2px dashed #DDD; padding-bottom: 12px; margin-bottom: 12px;">
        <input type="text" id="event-title-input" value="露營大會：選總召與會計！" placeholder="輸入活動名稱">
        <button class="btn" onclick="createRoom()">建立新活動 (房主)</button>
      </div>

      <!-- 加入房間選項 -->
      <div>
        <input type="text" id="room-id-input" placeholder="輸入房間 ID">
        <button class="btn" style="background-color: #BAE1FF;" onclick="joinRoom()">加入活動</button>
      </div>
    </div>

    <!-- 已連線成員清單 -->
    <div id="online-users-box" style="display:none; margin-top: 10px;">
      <div style="font-size: 0.95rem; margin-bottom: 5px;">🟢 目前線上成員：</div>
      <div id="user-tags-container"></div>
    </div>
  </div>

  <!-- 轉盤 1：選總召 -->
  <div class="card" id="card-leader">
    <div class="section-title">👑 第一關：抽出「總召」</div>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel-leader" width="280" height="280"></canvas>
    </div>
    <button id="spin-btn-leader" class="btn" style="font-size: 1.2rem; width: 85%; margin-top: 12px;" onclick="prepareSpin('LEADER')" disabled>開始抽總召！</button>
    <div id="result-leader" class="result-box">等待抽總召...</div>
  </div>

  <!-- 轉盤 2：選會計 -->
  <div class="card disabled-card" id="card-accountant">
    <div class="section-title">💰 第二關：抽出「會計」</div>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel-accountant" width="280" height="280"></canvas>
    </div>
    <button id="spin-btn-accountant" class="btn" style="background-color: #BAE1FF; font-size: 1.2rem; width: 85%; margin-top: 12px;" onclick="prepareSpin('ACCOUNTANT')" disabled>開始抽會計！</button>
    <div id="result-accountant" class="result-box">請先選出總召！</div>
  </div>

  <!-- 全螢幕倒數 & 中獎 PopUp 畫面 -->
  <div id="overlay" class="overlay">
    <div id="countdown-box" class="countdown-text" style="display:none;">3</div>
    
    <div id="winner-modal" class="winner-modal" style="display:none;">
      <div id="modal-title" class="winner-title">🎉 恭喜得主！</div>
      <div id="modal-name" class="winner-name">姓名</div>
      <button class="btn" style="background-color:#BAFFC9;" onclick="closeWinnerModal()">太讚啦！(縮小畫面)</button>
    </div>
  </div>

  <script>
    const initialMembers = ["鈴鈴", "文駿", "崔", "璟勝", "阿博", "豆腐"];
    const pastelColors = ["#FFB3BA", "#FFDFBA", "#FFFFBA", "#BAFFC9", "#BAE1FF", "#E8AEFF"];

    let leaderMembers = [...initialMembers];
    let accountantMembers = [];
    
    let leaderWinner = "";
    let accountantWinner = "";

    let peer = null;
    let connections = [];
    let hostConn = null;
    let isHost = false;

    // Canvas 轉盤設定
    const canvasLeader = document.getElementById('wheel-leader');
    const ctxLeader = canvasLeader.getContext('2d');
    let angleLeader = 0;

    const canvasAccountant = document.getElementById('wheel-accountant');
    const ctxAccountant = canvasAccountant.getContext('2d');
    let angleAccountant = 0;

    // 繪製轉盤 (黑字 + 粗白框)
    function drawWheel(ctx, list, angle) {
      const size = 280;
      const center = size / 2;
      const radius = center - 8;
      const numSegments = list.length;

      ctx.clearRect(0, 0, size, size);

      if (numSegments === 0) {
        ctx.fillStyle = "#E0E0E0";
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.fill();
        return;
      }

      const arcSize = (2 * Math.PI) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        const startArc = angle + i * arcSize;
        const endArc = startArc + arcSize;

        ctx.beginPath();
        ctx.fillStyle = pastelColors[i % pastelColors.length];
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startArc, endArc);
        ctx.fill();

        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.translate(center + Math.cos(startArc + arcSize / 2) * (radius * 0.65), 
                      center + Math.sin(startArc + arcSize / 2) * (radius * 0.65));
        ctx.rotate(startArc + arcSize / 2 + Math.PI / 2);
        
        ctx.font = "900 22px 'Zen Maru Gothic', cursive, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 7;
        ctx.lineJoin = "round";
        ctx.strokeText(list[i], 0, 0);

        ctx.fillStyle = "#111111";
        ctx.fillText(list[i], 0, 0);

        ctx.restore();
      }
    }

    drawWheel(ctxLeader, leaderMembers, angleLeader);
    drawWheel(ctxAccountant, ["？", "？", "？", "？", "？"], angleAccountant);

    // PeerJS 網路連線
    peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('status').innerText = `已登入！ ID: ${id}`;
    });

    // 房主建立房間
    function createRoom() {
      const title = document.getElementById('event-title-input').value.trim() || "露營大會：選總召與會計！";
      document.getElementById('event-title-display').innerText = "⛺️ " + title;
      
      isHost = true;
      document.getElementById('status').innerText = `你是房主 | 房間 ID: ${peer.id}`;
      document.getElementById('spin-btn-leader').disabled = false;
      document.getElementById('room-controls').style.display = 'none';
      document.getElementById('online-users-box').style.display = 'block';

      updateOnlineUsers(["房主 (你)"]);

      peer.on('connection', (conn) => {
        connections.push(conn);
        // 傳送當前活動名稱給剛進來的成員
        conn.on('open', () => {
          conn.send({ type: 'SYNC_TITLE', title: title });
          updateOnlineUsers(["房主", ...connections.map((c, i) => `成員 ${i+1}`)]);
        });
        conn.on('data', (data) => handleData(data));
      });
    }

    // 成員加入房間
    function joinRoom() {
      const roomId = document.getElementById('room-id-input').value.trim();
      if (!roomId) return alert("請輸入房間 ID");

      isHost = false;
      hostConn = peer.connect(roomId);

      hostConn.on('open', () => {
        document.getElementById('status').innerText = `已成功加入房間！`;
        document.getElementById('room-controls').style.display = 'none';
        document.getElementById('online-users-box').style.display = 'block';
      });

      hostConn.on('data', (data) => handleData(data));
    }

    function broadcast(data) {
      connections.forEach(conn => conn.send(data));
    }

    function updateOnlineUsers(list) {
      const container = document.getElementById('user-tags-container');
      container.innerHTML = "";
      list.forEach(name => {
        const span = document.createElement('span');
        span.className = 'user-tag';
        span.innerText = name;
        container.appendChild(span);
      });
    }

    // 準備抽籤（發起倒數 3 2 1）
    function prepareSpin(role) {
      if (!isHost) return;
      const data = { type: 'START_COUNTDOWN', role: role };
      broadcast(data);
      runCountdown(role);
    }

    // 倒數 3 2 1 動畫
    function runCountdown(role) {
      const overlay = document.getElementById('overlay');
      const box = document.getElementById('countdown-box');
      const modal = document.getElementById('winner-modal');

      modal.style.display = 'none';
      box.style.display = 'block';
      overlay.classList.add('active');

      let count = 3;
      box.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          box.innerText = count;
        } else if (count === 0) {
          box.innerText = "GO!";
        } else {
          clearInterval(timer);
          overlay.classList.remove('active');
          box.style.display = 'none';

          // 倒數結束，開始轉動轉盤
          if (isHost) {
            if (role === 'LEADER') {
              const targetIndex = Math.floor(Math.random() * leaderMembers.length);
              broadcast({ type: 'SPIN_LEADER', targetIndex });
              runLeaderAnimation(targetIndex);
            } else {
              const targetIndex = Math.floor(Math.random() * accountantMembers.length);
              broadcast({ type: 'SPIN_ACCOUNTANT', targetIndex });
              runAccountantAnimation(targetIndex);
            }
          }
        }
      }, 900);
    }

    // 處理收到連線資訊
    function handleData(data) {
      if (data.type === 'SYNC_TITLE') {
        document.getElementById('event-title-display').innerText = "⛺️ " + data.title;
      } else if (data.type === 'START_COUNTDOWN') {
        runCountdown(data.role);
      } else if (data.type === 'SPIN_LEADER') {
        runLeaderAnimation(data.targetIndex);
      } else if (data.type === 'SPIN_ACCOUNTANT') {
        runAccountantAnimation(data.targetIndex);
      }
    }

    // 抽總召動畫
    function runLeaderAnimation(targetIndex) {
      document.getElementById('spin-btn-leader').disabled = true;
      document.getElementById('result-leader').innerText = "🌀 正在抽取總召...";

      const numSegments = leaderMembers.length;
      const arcSize = (2 * Math.PI) / numSegments;
      const targetAngleSegment = (3 * Math.PI / 2) - (targetIndex * arcSize) - (arcSize / 2);
      const extraRounds = 5 * 2 * Math.PI;
      const finalAngle = angleLeader + extraRounds + (targetAngleSegment - (angleLeader % (2 * Math.PI)));

      let start = null;
      const duration = 4000;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = Math.min((timestamp - start) / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentAngle = angleLeader + (finalAngle - angleLeader) * easeOut;

        drawWheel(ctxLeader, leaderMembers, currentAngle);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          angleLeader = finalAngle;
          leaderWinner = leaderMembers[targetIndex];
          document.getElementById('result-leader').innerText = `🎉 總召：【${leaderWinner}】！`;

          // 彈出全螢幕恭喜 Modal
          showWinnerModal("👑 恭喜成為【總召】！", leaderWinner);

          // 準備第二個轉盤（排除總召）
          accountantMembers = initialMembers.filter(m => m !== leaderWinner);
          drawWheel(ctxAccountant, accountantMembers, angleAccountant);

          document.getElementById('card-accountant').classList.remove('disabled-card');
          document.getElementById('result-accountant').innerText = "等待抽會計...";

          if (isHost) {
            document.getElementById('spin-btn-accountant').disabled = false;
          }
        }
      }

      requestAnimationFrame(animate);
    }

    // 抽會計動畫
    function runAccountantAnimation(targetIndex) {
      document.getElementById('spin-btn-accountant').disabled = true;
      document.getElementById('result-accountant').innerText = "🌀 正在抽取會計...";

      const numSegments = accountantMembers.length;
      const arcSize = (2 * Math.PI) / numSegments;
      const targetAngleSegment = (3 * Math.PI / 2) - (targetIndex * arcSize) - (arcSize / 2);
      const extraRounds = 5 * 2 * Math.PI;
      const finalAngle = angleAccountant + extraRounds + (targetAngleSegment - (angleAccountant % (2 * Math.PI)));

      let start = null;
      const duration = 4000;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = Math.min((timestamp - start) / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentAngle = angleAccountant + (finalAngle - angleAccountant) * easeOut;

        drawWheel(ctxAccountant, accountantMembers, currentAngle);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          angleAccountant = finalAngle;
          accountantWinner = accountantMembers[targetIndex];
          document.getElementById('result-accountant').innerText = `💰 會計：【${accountantWinner}】！`;

          // 彈出全螢幕恭喜 Modal
          showWinnerModal("💰 恭喜成為【會計】！", accountantWinner);

          if (isHost) {
            document.getElementById('spin-btn-leader').innerText = "重新抽總召";
            document.getElementById('spin-btn-leader').disabled = false;
          }
        }
      }

      requestAnimationFrame(animate);
    }

    // 顯示恭喜彈窗
    function showWinnerModal(title, name) {
      const overlay = document.getElementById('overlay');
      const box = document.getElementById('countdown-box');
      const modal = document.getElementById('winner-modal');

      box.style.display = 'none';
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-name').innerText = name;
      modal.style.display = 'block';

      overlay.classList.add('active');
    }

    // 關閉/縮小彈窗
    function closeWinnerModal() {
      const overlay = document.getElementById('overlay');
      overlay.classList.remove('active');
    }
  </script>
</body>
</html>

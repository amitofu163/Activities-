<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>露營大會：選總召與會計！</title>

  <!-- 引入 Google Fonts 胖胖字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <!-- 引入 PeerJS 套件 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    /* 全頁面統一胖胖粗體 */
    * {
      box-sizing: border-box;
      font-family: 'Zen Maru Gothic', 'Mochiy Pop One', cursive, sans-serif;
      font-weight: 900;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: #FAF8F5;
      color: #333333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.8rem;
      color: #4A4A4A;
      text-shadow: 2px 2px 0px #FFF, 3px 3px 0px rgba(0,0,0,0.08);
      margin: 10px 0 15px 0;
      text-align: center;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      margin-bottom: 15px;
      text-align: center;
    }

    .btn {
      background-color: #FFB3BA;
      color: #333;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 0px #E598A0;
      transition: all 0.1s ease;
      margin: 5px;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0px #E598A0;
    }

    .btn:disabled {
      background-color: #E0E0E0;
      color: #A0A0A0;
      box-shadow: none;
      cursor: not-allowed;
    }

    input[type="text"] {
      width: 70%;
      padding: 10px;
      border: 3px solid #FFB3BA;
      border-radius: 12px;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    /* 轉盤容器 */
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 10px auto;
    }

    /* 轉盤指標 */
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 30px solid #FF6B6B;
      z-index: 10;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));
    }

    canvas {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }

    /* 結果顯示欄 */
    .result-box {
      font-size: 1.3rem;
      color: #555555;
      min-height: 40px;
      margin-top: 10px;
    }

    .status-tag {
      font-size: 0.9rem;
      background: #F0F0F0;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 10px;
      color: #6C757D;
    }
  </style>
</head>
<body>

  <h1>⛺️ 露營大會：選總召與會計！</h1>

  <!-- 房間設定區塊 -->
  <div class="card">
    <div id="status" class="status-tag">狀態：初始化中...</div>
    <div id="room-controls">
      <button class="btn" onclick="createRoom()">建立房間 (成為房主)</button>
      <div style="margin-top: 10px;">
        <input type="text" id="room-id-input" placeholder="輸入房間 ID">
        <button class="btn" style="background-color: #BAE1FF; box-shadow: 0 4px 0px #97C4E6;" onclick="joinRoom()">加入</button>
      </div>
    </div>
  </div>

  <!-- 轉盤區塊 -->
  <div class="card">
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="320" height="320"></canvas>
    </div>
    
    <button id="spin-btn" class="btn" style="font-size: 1.3rem; width: 80%; margin-top: 15px;" onclick="startSpin()" disabled>開始抽卡！</button>
    <div id="result" class="result-box">等待開始...</div>
  </div>

  <script>
    const members = ["鈴鈴", "文駿", "崔", "璟勝", "阿博", "豆腐"];
    
    // 淺色系（馬卡龍/莫蘭迪淺色）：紅、橙、黃、綠、藍、紫
    const colors = [
      "#FFB3BA", // 淺紅 (馬卡龍粉)
      "#FFDFBA", // 淺橙 (馬卡龍橘)
      "#FFFFBA", // 淺黃 (奶油黃)
      "#BAFFC9", // 淺綠 (薄荷綠)
      "#BAE1FF", // 淺藍 (天空藍)
      "#E8AEFF"  // 淺紫 (薰衣草紫)
    ];
    
    let peer = null;
    let connections = [];
    let hostConn = null;
    let isHost = false;

    // 轉盤繪製與動畫變數
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;
    let isSpinning = false;
    let targetMode = "總召"; // 先抽總召，再抽會計
    let leaderName = "";

    function drawWheel(angle) {
      const numSegments = members.length;
      const arcSize = (2 * Math.PI) / numSegments;
      ctx.clearRect(0, 0, 320, 320);

      for (let i = 0; i < numSegments; i++) {
        const startArc = angle + i * arcSize;
        const endArc = startArc + arcSize;

        // 畫扇形
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(160, 160);
        ctx.arc(160, 160, 150, startArc, endArc);
        ctx.fill();

        // 畫文字（黑字＋白框）
        ctx.save();
        ctx.translate(160 + Math.cos(startArc + arcSize / 2) * 100, 160 + Math.sin(startArc + arcSize / 2) * 100);
        ctx.rotate(startArc + arcSize / 2 + Math.PI / 2);
        ctx.font = "900 22px 'Zen Maru Gothic', cursive, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // 白框 (Stroke)
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 5;
        ctx.lineJoin = "round";
        ctx.strokeText(members[i], 0, 0);

        // 黑字 (Fill)
        ctx.fillStyle = "#222222";
        ctx.fillText(members[i], 0, 0);

        ctx.restore();
      }
    }

    drawWheel(currentAngle);

    // PeerJS 邏輯
    peer = new Peer();

    peer.on('open', (id) => {
      document.getElementById('status').innerText = `已連線！你的 ID: ${id}`;
    });

    function createRoom() {
      isHost = true;
      document.getElementById('status').innerText = `你是房主 | 房間 ID: ${peer.id}`;
      document.getElementById('spin-btn').disabled = false;
      document.getElementById('room-controls').style.display = 'none';

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => handleData(data));
      });
    }

    function joinRoom() {
      const roomId = document.getElementById('room-id-input').value.trim();
      if (!roomId) return alert("請輸入房間 ID");

      isHost = false;
      hostConn = peer.connect(roomId);

      hostConn.on('open', () => {
        document.getElementById('status').innerText = `已成功加入房間！`;
        document.getElementById('room-controls').style.display = 'none';
      });

      hostConn.on('data', (data) => handleData(data));
    }

    function broadcast(data) {
      connections.forEach(conn => conn.send(data));
    }

    function startSpin() {
      if (isSpinning) return;
      
      const targetIndex = Math.floor(Math.random() * members.length);
      const data = { type: 'SPIN', targetIndex: targetIndex, mode: targetMode };
      
      if (isHost) {
        broadcast(data);
        runSpinAnimation(targetIndex, targetMode);
      }
    }

    function handleData(data) {
      if (data.type === 'SPIN') {
        runSpinAnimation(data.targetIndex, data.mode);
      }
    }

    function runSpinAnimation(targetIndex, mode) {
      isSpinning = true;
      document.getElementById('spin-btn').disabled = true;
      document.getElementById('result').innerText = `正在抽取【${mode}】中...`;

      const numSegments = members.length;
      const arcSize = (2 * Math.PI) / numSegments;
      
      // 計算停止角度 (頂部指標對應角度為 3*PI/2)
      const targetAngleSegment = (3 * Math.PI / 2) - (targetIndex * arcSize) - (arcSize / 2);
      const extraRounds = 5 * 2 * Math.PI; // 旋轉 5 圈
      const finalAngle = currentAngle + extraRounds + (targetAngleSegment - (currentAngle % (2 * Math.PI)));

      let start = null;
      const duration = 4000; // 4秒

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = Math.min((timestamp - start) / duration, 1);
        
        // 緩動函數 ease-out
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const angleNow = currentAngle + (finalAngle - currentAngle) * easeOut;

        drawWheel(angleNow);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentAngle = finalAngle;
          isSpinning = false;
          const winner = members[targetIndex];

          if (mode === "總召") {
            leaderName = winner;
            document.getElementById('result').innerText = `🎉 總召：【${winner}】！`;
            targetMode = "會計";
            if (isHost) {
              document.getElementById('spin-btn').innerText = "繼續抽會計！";
              document.getElementById('spin-btn').disabled = false;
            }
          } else {
            document.getElementById('result').innerHTML = `🎉 總召：【${leaderName}】<br>💰 會計：【${winner}】！`;
            if (isHost) {
              document.getElementById('spin-btn').innerText = "重新抽卡";
              targetMode = "總召";
              document.getElementById('spin-btn').disabled = false;
            }
          }
        }
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
